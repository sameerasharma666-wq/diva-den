      <div class="rowline"><span>Combo chain</span><b class="gold">x${combo} (+${combo*5}%)</b></div>
      <div class="rowline"><span>Winning so far</span><b class="gold">+${fmt(won)}</b></div>`;
  }
  async function flip(i){
    if(lock||!live||cards[i].up||cards[i].done)return;
    cards[i].up=true;SFX.card();draw();
    if(first===null){first=i;return;}
    lock=true;moves++;
    await wait(620);
    const a=cards[first],b=cards[i];
    if(a.pair===b.pair){
      a.done=b.done=true;matched++;combo++;SFX.chip();
      won+=Math.round(bet*0.15*(1+ (combo-1)*0.05));
      if(matched===8){
        live=false;
        won+=Math.round(bet*0.6);
        GameCtx.pay(won);
        const tier=won>=bet*2.5?"jackpot":won>=bet*1.5?"mega":"big";
        showFx(tier,{kicker:"MEMORY MATCH",amount:won,line:"Full board cleared · +60% board bonus",badges:["COMBO x"+combo]});
        res.append(resultCard("win","Board cleared!",won-bet,"Pairs +15% each · combo +5% a step · full board +60%"));
        const again=el("button","btn-gold","NEW BOARD");again.style.cssText="margin-top:10px";
        again.onclick=()=>{res.innerHTML="";start();};res.append(again);
      }else toast("Pair! Combo x"+combo);
    }else{
      a.up=false;b.up=false;combo=0;SFX.tick();
    }
    first=null;lock=false;draw();
  }
  const startB=el("button","btn-gold","SHUFFLE & DEAL 16");startB.style.cssText="width:100%;margin-top:10px";
  startB.onclick=()=>start();

}});

registerGame("scratch",{name:"Scratch Cards",blurb:"Gold foil. Match three faces.",tag:"3x3 grid · match 3 · x1.5-x100",
run(body){
  let bet=GameCtx.bet;
  const wrap=el("div");
  const card=el("div","sc-card");
  const gridEl=el("div","sc-grid");
  const foil=el("div","sc-foil");
  const betR=betRow(v=>{bet=v;});
  const btns=el("div","bj-actions");
  const res=el("div");
  wrap.append(card,betR,btns,res);
  body.append(wrap);
  let cells=[],buying=false;
  function start(){
    if(!STORE.bet(bet)){toast("Not enough chips");return;}
    GameCtx.wag(bet);buying=true;res.innerHTML="";
    /* one in five wins: 20% force a triple */
    const winner=Math.random()<0.2;
    cells=[];
    const cast=SESSION.scratch;
    if(winner){
      const w=cast[ri(0,11)];
      for(let i=0;i<9;i++)cells.push(w);
      /* replace non-winning cells to keep exactly 3 */
      const idx=shuffle([...Array(9).keys()]).slice(3);
      idx.forEach(i=>cells[i]=cast[ri(0,11)]);
    }else{
      for(let i=0;i<9;i++)cells.push(cast[ri(0,11)]);
      /* ensure no accidental triple */
      const cnt={};cells.forEach(c=>cnt[c.prize]=(cnt[c.prize]||0)+1);
      const tri=Object.keys(cnt).find(k=>cnt[k]>=3);
      if(tri){let fixed=0;for(let i=0;i<9&&fixed<1;i++){if(cells[i].prize==tri){let alt=cast[ri(0,11)];let guard=0;while(alt.prize==tri&&guard++<20)alt=cast[ri(0,11)];cells[i]=alt;fixed++;}}}
    }
    drawGrid();addFoil();
  }
  function drawGrid(){
    gridEl.innerHTML="";
    cells.forEach(c=>{
      const cell=el("div","sc-cell");
      const im=new Image();im.src=c.cast.kind==="friend"?friendPhoto(c.cast.id,ri(0,PHOTO_COUNTS[c.cast.id]-1)):packPhoto(c.cast.pack);im.loading="lazy";
      cell.append(im,el("div","prize-l","x"+c.prize));
      gridEl.append(cell);
    });
  }
  function addFoil(){
    foil.style.display="block";foil.style.opacity=1;foil.style.transition="opacity .4s";
    card.append(gridEl,foil);
    let scratching=false;
    const scratch=e=>{
      const p=e.touches?e.touches[0]:e;
      const r=foil.getBoundingClientRect();
      foil.style.setProperty("--sx",(p.clientX-r.left)+"px");
      /* erase in patches: overlay holes via radial-gradient stack */
      const cur=foil.style.backgroundImage||"";
      const gx=((p.clientX-r.left)/r.width*100).toFixed(1),gy=((p.clientY-r.top)/r.height*100).toFixed(1);
      holes.push(`${gx}% ${gy}%`);
      if(holes.length%3===0)SFX.tick();
      applyHoles();
    };
    let holes=[];
    function applyHoles(){
      /* simulate scratching by punching a growing hole where user drags: use CSS mask */
      const mask=holes.map(h=>`radial-gradient(circle 26px at ${h}, transparent 98%, #000 100%)`).join(",");
      foil.style.webkitMaskImage=mask;foil.style.maskImage=mask;
      const area=holes.length/220;
      if(area>=1)reveal();
    }
    foil.onpointerdown=e=>{scratching=true;foil.setPointerCapture(e.pointerId);scratch(e);};
    foil.onpointermove=e=>{if(scratching)scratch(e);};
    foil.onpointerup=()=>scratching=false;
  }
  function reveal(){
    foil.style.opacity=0;setTimeout(()=>foil.style.display="none",420);
    buying=false;SFX.chip();
    const cnt={};cells.forEach(c=>cnt[c.prize]=(cnt[c.prize]||0)+1);
    const tri=Object.keys(cnt).find(k=>cnt[k]>=3);
    if(tri){
      const m=+tri;const won=Math.round(bet*m);GameCtx.pay(won);
      const who=cells.find(c=>c.prize===m).cast;
      const tier=m>=40?"jackpot":m>=10?"mega":m>=4?"big":"win";
      showFx(tier,{kicker:"SCRATCH CARDS",amount:won,line:"Match 3 — "+(who?who.name:"the foil")+" pays x"+m,badges:["MATCH 3 · x"+m]});
      res.append(resultCard("win","MATCH 3 — PRIZE x"+m,won-bet,""));
    }else{
      SFX.lose();
      res.append(resultCard("lose","No match",-bet,"One in five cards is a winner. Foil again?"));
    }
    const again=el("button","btn-gold","NEXT CARD");again.style.cssText="margin-top:10px";
    again.onclick=()=>{res.innerHTML="";start();};
    res.append(again);
  }
  const buyB=el("button","btn-gold","BUY A CARD");
  const revB=el("button","btn-ghost","REVEAL ALL");
  revB.onclick=()=>{if(buying)reveal();};
  buyB.onclick=()=>start();
  btns.append(buyB,revB);
  card.append(gridEl,foil);
}});

run(body){

registerGame("shoot",{name:"Carnival Shoot",blurb:"12 bullets. Pop every diva that rises.",tag:"12 bullets · crowns pay x2.5",
run(body){
  let bet=GameCtx.bet,hits=0,bullets=12,round=0,live=false;
  const wrap=el("div");
  const stage=el("div","cs-stage");
  const bulletBar=el("div","glass panel");bulletBar.style.cssText="display:flex;gap:5px;flex-wrap:wrap;justify-content:center";
  const betR=betRow(v=>{bet=v;});
  const res=el("div");
  wrap.append(stage,bulletBar,betR,res);
  body.append(wrap);
  let divas=[];
  function start(){
    if(!STORE.bet(bet)){toast("Not enough chips");return;}
    GameCtx.wag(bet);round++;hits=0;bullets=12;live=true;res.innerHTML="";
    stage.innerHTML="";
    /* 3 ledges, 4 divas per ledge */
    const casts=shuffle(castList).slice(0,12);
    divas=[];
    for(let i=0;i<12;i++){
      const lane=Math.floor(i/4),slot=i%4;
      const c=casts[i];
      const d=el("div","cs-diva"+(Math.random()<0.18?" crown":""));
      d.style.cssText=`left:${6+slot*24+(lane%2)*4}%;bottom:${lane===0?"-100px":lane===1?"88px":"176px"}`;
      const im=new Image();im.src=c.kind==="friend"?friendPhoto(c.id,ri(0,PHOTO_COUNTS[c.id]-1)):packPhoto(c.pack);im.loading="lazy";
      d.append(im);d._c=c;d._up=false;
      d.onclick=()=>hit(d);
      stage.append(d);divas.push(d);
    }
    popWave();
    drawBullets();
  }
  function popWave(){
    const down=divas.filter(d=>!d._up&&!d._hit);
    shuffle(down).slice(0,ri(2,4)).forEach((d,i)=>setTimeout(()=>{if(live&&!d._hit){d._up=true;d.classList.add("up");SFX.pop();
      setTimeout(()=>{if(!d._hit&&live){d._up=false;d.classList.remove("up");}},ri(1600,2800));}},i*260));
  }
  const waveT=setInterval(()=>{if(live)popWave();else clearInterval(waveT);},2100);
  function hit(d){
    if(!live||!d._up||d._hit||bullets<=0)return;
    bullets--;d._hit=true;d._up=false;d.classList.add("hit");d.classList.remove("up");
    hits++;SFX.bonk();d.classList.add("flashwin");
    const crown=d.classList.contains("crown");
    toast((crown?"👑 CROWNED ":"")+d._c.name+" down — "+(crown?"x2.5":"x0.15"));
    drawBullets();
    if(bullets===0)settle();
  }
  function drawBullets(){
    bulletBar.innerHTML="";
    for(let i=0;i<12;i++)bulletBar.append(el("span","cs-bullet"+(i<12-bullets?" spent":""),i<12-bullets?"·":String(12-i)));
    bulletBar.append(el("span","", `<b style="color:var(--gold);margin-left:8px">HITS ${hits}</b>`));
  }
  function settle(){
    live=false;clearInterval(waveT);
    let won=Math.round(bet*0.15*hits)+Math.round(bet*2.5*divas.filter(d=>d._hit&&d.classList.contains("crown")).length);
    divas.forEach(d=>{if(d._hit&&d.classList.contains("crown"))d._counted=true;});
    if(hits>=10){won+=bet*2;}
    GameCtx.pay(won);
    if(won>0){
      const tier=hits>=10?"jackpot":won>=bet*2?"mega":won>=bet?"big":"win";
      showFx(tier,{kicker:"CARNIVAL SHOOT",amount:won,line:hits+" divas dropped"+(hits>=10?" — SHARPSHOOTER +2x":""),badges:[hits+" HITS",...(hits>=10?["SHARPSHOOTER"]:[])]});
      res.append(resultCard("win",hits+" dropped",won-bet,hits>=10?"Sharpshooter bonus +2x":"Crowns pay x2.5 each"));
    }else{SFX.lose();res.append(resultCard("lose","Clean miss",-bet,"They were RIGHT there."));}
    const again=el("button","btn-gold","NEXT ROUND");again.style.cssText="margin-top:10px";
    again.onclick=()=>{res.innerHTML="";start();};
    res.append(again);
  }
  drawBullets();
  const startB=el("button","btn-gold","TAKE THE RIFLE");startB.style.cssText="width:100%;margin-top:10px";
  startB.onclick=()=>{if(!live)start();};
  wrap.insertBefore(startB,res);
  if(App.cleanup){const old=App.cleanup;App.cleanup=()=>{clearInterval(waveT);old();};}
  else App.cleanup=()=>clearInterval(waveT);
}});

registerGame("pinball",{name:"Photo Pinball",blurb:"Flip for it. Bumpers wear the faces.",tag:"flippers · photo bumpers · 3 balls",
run(body){
  let bet=GameCtx.bet,points=0,balls=3,live=false,raf=null,phys=null;
  const wrap=el("div");
  const stage=el("div","pb-stage");
  const scoreD=el("div","pb-score","0");
  const flL=el("button","pb-flip l"),flR=el("button","pb-flip");
  flL.style.bottom="12px";flR.style.cssText="right:12px;bottom:12px";
  stage.append(scoreD,flL,flR);
  const betR=betRow(v=>{bet=v;});
  const res=el("div");
  wrap.append(stage,betR,res);
  body.append(wrap);
  const keys={l:false,r:false};
  function placeChrome(){
    /* bumpers + slings, reshuffled faces */
    $$(".pb-bumper,.pb-sling",stage).forEach(x=>x.remove());
    const W=stage.clientWidth,H=stage.clientHeight;
    const bps=[[.3,.28],[.52,.18],[.72,.3],[.38,.5],[.62,.52]];
    bps.forEach(([fx,fy])=>{
      const b=el("div","pb-bumper");
      const c=castPick();
      const im=new Image();im.src=c.kind==="friend"?friendPhoto(c.id,ri(0,PHOTO_COUNTS[c.id]-1)):packPhoto(c.pack);im.loading="lazy";
      b.append(im);b.style.left=(fx*W)+"px";b.style.top=(fy*H)+"px";
      b._c=c;stage.append(b);
    });
    [[.22,.72,-14],[.78,.72,14]].forEach(([fx,fy,r])=>{
      const s=el("div","pb-sling");
      s.style.left=(fx*W)+"px";s.style.top=(fy*H)+"px";s.style.setProperty("--r",r+"deg");
      stage.append(s);
    });
  }
  function launch(){
    phys={x:stage.clientWidth*0.5,y:40,vx:pick([-1.6,1.6]),vy:1.2,dead:false};
    SFX.whoosh();
  }
  function tick(){
    if(!phys)return;
    const W=stage.clientWidth,H=stage.clientHeight;
    const b=phys;
    b.x+=b.vx;b.y+=b.vy;
    if(b.x<8){b.x=8;b.vx=Math.abs(b.vx)*.9;}
    if(b.x>W-8){b.x=W-8;b.vx=-Math.abs(b.vx)*.9;}
    if(b.y<8){b.y=8;b.vy=Math.abs(b.vy);}
    /* bumpers */
    $$(".pb-bumper",stage).forEach(bp=>{
      const bx=parseFloat(bp.style.left),by=parseFloat(bp.style.top);
      const dx=b.x-bx,dy=b.y-by,d=Math.hypot(dx,dy);
      if(d<34){
        const nx=dx/d,ny=dy/d;
        b.vx=nx*4.6;b.vy=ny*4.6;
        points+=100;scoreD.textContent=fmt(points);SFX.pop();
        bp.classList.add("boom");setTimeout(()=>bp.classList.remove("boom"),120);
      }
    });
    /* slings */
    $$(".pb-sling",stage).forEach(sl=>{
      const sx=parseFloat(sl.style.left),sy=parseFloat(sl.style.top);
      if(Math.hypot(b.x-sx,b.y-sy)<26){b.vy=-Math.abs(b.vy)*1.05;b.vx+= (b.x>sx?2:-2);points+=50;scoreD.textContent=fmt(points);SFX.tick();}
    });
    /* flippers */
    const fy=H-22;
    if(b.y>=fy-6&&b.y<=fy+8){
      if(b.x<W/2){
        if(keys.l){b.vy=-8.5;b.vx=Math.abs(b.vx)*.7+2.2;SFX.bonk();}
        if(b.x<6){b.x=6;b.vx=Math.abs(b.vx);}
      }else{
        if(keys.r){b.vy=-8.5;b.vx=-(Math.abs(b.vx)*.7+2.2);SFX.bonk();}
        if(b.x>W-6){b.x=W-6;b.vx=-Math.abs(b.vx);}
      }
    }
    /* drain */
    if(b.y>H+16){b.dead=true;}
    const ballEl=$(".pb-ball",stage);
    if(ballEl){ballEl.style.left=b.x+"px";ballEl.style.top=b.y+"px";}
    if(b.dead){drain();return;}
    raf=requestAnimationFrame(tick);
  }
  async function drain(){
    phys=null;balls--;
    toast(balls>0?"Ball lost. "+balls+" left":"Last ball lost.");
    if(balls<=0)finish();else setTimeout(launch,700);
  }
  async function finish(){
    cancelAnimationFrame(raf);live=false;
    const won=Math.round(points/5000*bet);
    GameCtx.pay(won);
    if(won>0){
      const tier=won>=bet*4?"jackpot":won>=bet*2?"mega":won>=bet?"big":"win";
      showFx(tier,{kicker:"PHOTO PINBALL",amount:won,line:fmt(points)+" points · pays points/5000 x bet",badges:[fmt(points)+" PTS"]});
      res.append(resultCard("win",fmt(points)+" points",won-bet,""));
    }else{SFX.lose();res.append(resultCard("lose","Tilted out",-bet,fmt(points)+" points — needed "+fmt(5000)+" for a payout."));}
    const again=el("button","btn-gold","NEW BALL GAME");again.style.cssText="margin-top:10px";
    again.onclick=()=>{res.innerHTML="";start();};
    res.append(again);
  }
  function start(){
    if(!STORE.bet(bet)){toast("Not enough chips");return;}
    GameCtx.wag(bet);
    points=0;balls=3;live=true;res.innerHTML="";scoreD.textContent="0";
    placeChrome();
    const ballEl=el("div","pb-ball");stage.append(ballEl);
    launch();
    cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);
  }
  const press=(k,on)=>e=>{e.preventDefault();keys[k]=on;flL.classList.toggle("act",on&&k==="l");flR.classList.toggle("act",on&&k==="r");};
  flL.onpointerdown=press("l",true);flL.onpointerup=flL.onpointerleave=press("l",false);
  flR.onpointerdown=press("r",true);flR.onpointerup=flR.onpointerleave=press("r",false);
  const kd=e=>{if(e.key==="z"||e.key==="Z"){keys.l=true;flL.classList.add("act");}if(e.key==="m"||e.key==="M"){keys.r=true;flR.classList.add("act");}};
  const ku=e=>{if(e.key==="z"||e.key==="Z"){keys.l=false;flL.classList.remove("act");}if(e.key==="m"||e.key==="M"){keys.r=false;flR.classList.remove("act");}};
  document.addEventListener("keydown",kd);document.addEventListener("keyup",ku);
  const startB=el("button","btn-gold","INSERT COIN · 3 BALLS");startB.style.cssText="width:100%;margin-top:10px";
  startB.onclick=()=>{if(!live)start();};
  wrap.insertBefore(startB,res);
  const oldClean=App.cleanup;
  App.cleanup=()=>{cancelAnimationFrame(raf);document.removeEventListener("keydown",kd);document.removeEventListener("keyup",ku);if(oldClean)oldClean();};
}});
</script>

/* ================= WHACK A DIVA ================= */
registerGame("whack",{name:"Whack a Diva",blurb:"Hammer time. 45 seconds of chaos.",tag:"NEW · hammer time · 45 seconds",isNew:true,
run(body){
  let bet=GameCtx.bet,live=false,score=0,combo=0,tLeft=45,timer=null,popTimer=null;
  const wrap=el("div");
  const hud=el("div","glass panel");hud.style.cssText="display:flex;justify-content:space-between;align-items:center";
  const grid=el("div","wh-grid");
  const betR=betRow(v=>{bet=v;});
  const res=el("div");
  wrap.append(hud,grid,betR,res);
  body.append(wrap);
  const mallet=el("div","wh-mallet","🔨");
  document.body.append(mallet);
  const holes=[];
  for(let i=0;i<9;i++){
    const h=el("div","wh-hole");
    h.onpointerdown=e=>{
      moveMallet(e);
      if(!live)return;
      const pop=$(".wh-pop",h);
      if(h.classList.contains("up")&&pop){
        const kind=h._kind;
        h.classList.add("whacked");
        setTimeout(()=>h.classList.remove("whacked"),160);
        if(kind==="ex"){
          combo=0;SFX.lose();h.classList.remove("up");h._up=false;
          h._penalty=(h._penalty||0)+bet;
          toast("You whacked THE EX. She took 1x your bet. Never hit her.");
        }else{
          combo++;
          const gold=kind==="gold";
          const pts=(gold?2:0.3)*(1+Math.min(1,(combo-1)*0.08));
          h._score=(h._score||0)+Math.round(bet*pts);
          score+=Math.round(bet*pts);
          SFX.bonk();
          if(gold)showFx("big",{kicker:"WHACK A DIVA",amount:Math.round(bet*2),line:"GOLDEN VEDHIKA — x2 whack!",badges:["GOLDEN"]});
          else toast("Whacked! +"+Math.round(bet*pts));
        }
        h.classList.remove("up");h._up=false;
        updHud();
      }else if(live){
        combo=0;SFX.tick();updHud();
      }
    };
    holes.push(h);grid.append(h);
  }
  function moveMallet(e){
    mallet.style.left=e.clientX+"px";mallet.style.top=e.clientY+"px";
    mallet.classList.add("on");clearTimeout(moveMallet._t);moveMallet._t=setTimeout(()=>mallet.classList.remove("on"),150);
  }
  function updHud(){
    hud.innerHTML=`<div><p class="k" style="font-size:9px;font-weight:900;letter-spacing:.16em;color:rgba(255,233,184,.55)">TIME</p><p class="arc gold" style="font-size:18px">${tLeft}s</p></div>
      <div style="text-align:center"><p class="k" style="font-size:9px;font-weight:900;letter-spacing:.16em;color:rgba(255,233,184,.55)">WHACKED VALUE</p><p class="arc gold" style="font-size:18px">+${fmt(score)}</p></div>
      <div style="text-align:right"><p class="k" style="font-size:9px;font-weight:900;letter-spacing:.16em;color:rgba(255,233,184,.55)">COMBO</p><p class="arc gold" style="font-size:18px">x${combo}</p></div>`;
  }
  function popOne(){
    if(!live)return;
    const free=holes.filter(h=>!h._up);
    if(free.length){
      const h=pick(free);
      const r=Math.random();
      h._kind=r<0.14?"ex":r<0.24?"gold":"diva";
      const c=h._kind==="ex"?{url:BASE+EX.photo,name:"THE EX"}:h._kind==="gold"?{url:friendPhoto("vedhika",ri(0,5)),name:"Vedhika"}:(()=>{const p=castPick();return{url:p.kind==="friend"?friendPhoto(p.id,ri(0,PHOTO_COUNTS[p.id]-1)):packPhoto(p.pack),name:p.name};})();
      h.innerHTML="";
      const pop=el("div","wh-pop");
      const im=new Image();im.src=c.url;im.loading="eager";pop.append(im);
      if(h._kind==="gold")pop.append(el("div","wh-crown-badge","👑"));
      h.append(pop);
      h.classList.add("up");if(h._kind==="ex")h.classList.add("ex");
      h._up=true;
      const dur=h._kind==="ex"?ri(900,1400):ri(750,1300);
      setTimeout(()=>{if(h._up&&!live)return;h.classList.remove("up","ex");h._up=false;},dur);
    }
    popTimer=setTimeout(popOne,Math.max(260,ri(650,1100)-Math.floor((45-tLeft)*8)));
  }
  function start(){
    if(!STORE.bet(bet)){toast("Not enough chips");return;}
    GameCtx.wag(bet);
    score=0;combo=0;tLeft=45;live=true;res.innerHTML="";
    holes.forEach(h=>{h._up=false;h._penalty=0;h.classList.remove("up","ex");});
    updHud();
    startB.style.display="none";
    popOne();
    timer=setInterval(()=>{
      tLeft--;updHud();
      if(tLeft<=0)finish();
    },1000);
  }
  function finish(){
    live=false;clearInterval(timer);clearTimeout(popTimer);
    holes.forEach(h=>{h.classList.remove("up","ex");h._up=false;});
    let penalty=0;holes.forEach(h=>penalty+=(h._penalty||0));
    const won=Math.max(0,Math.round(score-penalty));
    GameCtx.pay(won);
    startB.style.display="";
    if(won>0){
      const tier=won>=bet*8?"jackpot":won>=bet*4?"mega":won>=bet*2?"big":"win";
      showFx(tier,{kicker:"WHACK A DIVA",amount:won,line:"45 seconds of hammer justice",badges:[combo>=10?"COMBO LEGEND":"WHACKED"]});
      res.append(resultCard("win","Whack complete",won-bet,penalty>0?"The Ex penalty: -"+fmt(penalty):"Clean hammering. The Ex untouched."));
    }else{SFX.lose();res.append(resultCard("lose","The divas remain unwhacked",-bet,penalty>0?"You kept hitting The Ex. Stop that.":""));}
    const again=el("button","btn-gold","GO AGAIN");again.style.cssText="margin-top:10px";
    again.onclick=()=>{res.innerHTML="";start();};
    res.append(again);
  }
  updHud();
  const startB=el("button","btn-gold","GRAB THE MALLET · 45s");startB.style.cssText="width:100%;margin-top:10px";
  startB.onclick=()=>{if(!live)start();};
  wrap.insertBefore(startB,res);
  const oldClean=App.cleanup;
  App.cleanup=()=>{clearInterval(timer);clearTimeout(popTimer);mallet.remove();if(oldClean)oldClean();};
}});

const DB_SCENARIOS=[
  {q:"Who shows up 40 minutes late — with iced coffee, unbothered?",narr:n=>`${n} strolls in at +40, sips, says "traffic". There was no traffic. The vibe was immaculate anyway.`},
  {q:"Who gets the aunties on HER side of the argument?",narr:n=>`${n} deployed the "namaste, didi" combo. The aunties folded instantly. The motion carried.`},

  {q:"Who cries at the farewell slideshow and denies it through the sniffles?",narr:n=>`Slide 14 hit ${n} hard. "It's the AC," they said. It was not the AC.`},
  {q:"Who leaves the party with leftover cake AND the serving spoon?",narr:n=>`${n} was seen at the taxi rank, tupperware in hand, spoon tucked in like a sidearm. No survivors.`},

  {q:"Who claims they're leaving in 5 minutes and stays 3 more hours?",narr:n=>`${n} said "last round" five times. The last round was at 2am. We were all witnesses.`},
  {q:"Who orders the spiciest thing on the menu and doesn't flinch?",narr:n=>`${n} asked the waiter if the "extra hot" was a typo. Then finished it with a straight face.`},
  {q:"Who disappears mid-party and is found teaching the grandma card games?",narr:n=>`${n} was located an hour later, three card games deep with the grandmas, winning. Obviously.`},
  {q:"Who brings a plus-one NOBODY has ever seen before?",narr:n=>`${n}'s plus-one was introduced as "my people". The den still has questions.`}
];
registerGame("betting",{name:"Diva Book",blurb:"Fake bets. Real drama. Decimal odds.",tag:"NEW · fake betting · real drama",isNew:true,
run(body){
  let bet=GameCtx.bet,round=null,slip=null;
  const wrap=el("div");
  const scenBox=el("div");
  const oddsBox=el("div");
  const slipBox=el("div");
  const betR=betRow(v=>{bet=v;updSlip();});
  const res=el("div");
  wrap.append(scenBox,oddsBox,slipBox,betR,res);
  body.append(wrap);
  function newRound(){
    slip=null;scenBox.innerHTML="";oddsBox.innerHTML="";slipBox.innerHTML="";res.innerHTML="";
    const scen=pick(DB_SCENARIOS);
    const field=shuffle(castList).slice(0,6);
    /* bookmaker: build implied probs with margin, convert to decimal odds */
    const rawW=field.map(()=>rnd(0.5,1.6));
    const sum=rawW.reduce((a,b)=>a+b,0);
    const MARGIN=0.86;
    const odds=field.map((c,i)=>({cast:c,prob:rawW[i]/sum*MARGIN,odds:Math.max(1.5,Math.round((sum*MARGIN/rawW[i])*10)/10)}))
      .sort((a,b)=>a.odds-b.odds);
    round={scen,odds};
    scenBox.append(el("div","db-scen popin",`<p class="sn">The Tea Lines · Match ${ri(100,999)}</p><p class="sq">${scen.q}</p>`));
    const grid=el("div","db-odds");
    odds.forEach(o=>{
      const b=el("button","db-odd");
      const im=new Image();im.src=o.cast.kind==="friend"?friendPhoto(o.cast.id,ri(0,PHOTO_COUNTS[o.cast.id]-1)):packPhoto(o.cast.pack);im.loading="lazy";
      b.append(im,el("div","n",o.cast.name),el("div","o",o.odds.toFixed(1)));
      b.onclick=()=>{slip=o;$$(".db-odd",grid).forEach(x=>x.classList.remove("sel"));b.classList.add("sel");SFX.click();updSlip();};
      grid.append(b);
    });
    oddsBox.append(grid);
    updSlip();
  }
  function updSlip(){
    slipBox.innerHTML="";
    if(!slip){slipBox.append(el("p","hint","Tap the odds to pick your diva — favourites pay less, longshots pay dreams. One bet, one outcome, full narrative."));return;}
    const s=el("div","db-slip popin");
    s.append(el("div","row",`<span>Pick</span><b>${slip.cast.name}</b>`));
    s.append(el("div","row",`<span>Odds</span><b class="gold">${slip.odds.toFixed(1)}</b>`));
    s.append(el("div","row",`<span>Stake</span><b>${fmt(bet)} chips</b>`));
    s.append(el("div","row",`<span>Return if hit</span><b class="gold">${fmt(Math.round(bet*slip.odds))}</b>`));
    const go=el("button","btn-gold","PLACE THE BET");go.style.cssText="width:100%;margin-top:10px";
    go.onclick=resolve;
    s.append(go);slipBox.append(s);
  }
  async function resolve(){
    if(!slip||!round)return;
    const{scen,odds}=round,sel=slip;
    if(!STORE.bet(bet)){toast("Not enough chips");return;}
    GameCtx.wag(bet);
    slipBox.innerHTML="";oddsBox.innerHTML="";
    scenBox.append(el("div","db-scen",`<p class="sn">Resolving…</p><p class="sq">${scen.q}</p>`));
    await wait(1500);
    let r=Math.random(),hit=odds[0];
    for(const o of odds){r-=o.prob;if(r<=0){hit=o;break;}}
    const winner=hit.cast;
    const won=hit.cast.key===sel.cast.key?Math.round(bet*sel.odds):0;
    let narr=scen.narr(winner.name);
    if(won>0&&sel.odds>=4)narr+=" LONGSHOT LANDS — the book is in shambles.";
    scenBox.append(el("div","db-narr popin",`<b>${winner.name}</b> — ${narr}`));
    if(won>0){
      GameCtx.pay(won);
      const tier=sel.odds>=6?"jackpot":sel.odds>=3.5?"mega":sel.odds>=2?"big":"win";
      showFx(tier,{kicker:"DIVA BOOK",amount:won,line:`${sel.cast.name} at ${sel.odds.toFixed(1)} — CASHED`,badges:["ODDS "+sel.odds.toFixed(1)]});
      res.append(resultCard("win","THE BOOK PAYS",won-bet,""));
    }else{
      SFX.lose();
      res.append(resultCard("lose",winner.name+" takes it",-bet,"The odds were honest. The drama always is."));
    }
    const again=el("button","btn-gold","NEXT LINE");again.style.cssText="margin-top:10px";
    again.onclick=()=>newRound();
    res.append(again);
  }
  newRound();
}});

  function updHud(){

    const rt=$(".rb-round",fx);if(rt)rt.textContent="ROUND "+round+" · "+roundsWon[0]+"-"+roundsWon[1]+" · "+tLeft+"s";
    const spcBtn=$(".rb-call[data-id=spc]",fx);
    if(spcBtn)spcBtn.classList.toggle("cool",meter[0]<100);
  }
  function updCools(){
    $$(".rb-call",fx).forEach(b=>{
      const id=b.dataset.id;
      const cd=$(".cd",b);
      if(cools[id]>0){b.classList.add("cool");cd.style.width="100%";cd.style.transition="width "+cools[id]+"s linear";cd.style.width="0";}
      else{b.classList.remove("cool");cd.style.width="0";}
    });
  }
  function dmgPop(side,amount){
    const f=$("#rb-f"+side,fx);if(!f)return;
    const d=el("div","rb-dmg","-"+Math.round(amount));
    d.style.left=f.style.left;d.style.bottom="150px";
    fx.append(d);setTimeout(()=>d.remove(),800);
    const imp=el("div","rb-impact");imp.style.left=f.style.left;imp.style.bottom="140px";
    fx.append(imp);setTimeout(()=>imp.remove(),320);
    f.classList.remove("hurt");void f.offsetWidth;f.classList.add("hurt");
    fx.querySelector(".rb-arena")?.classList.add("shake");
    setTimeout(()=>fx.querySelector(".rb-arena")?.classList.remove("shake"),400);
  }
  function doAttack(kind){
    if(!live||cools[kind]>0)return;
    const f1=$("#rb-f0",fx);
    if(kind==="jab"){cools.jab=.45;}
    if(kind==="kick"){cools.kick=.9;}
    if(kind==="spc"){if(meter[0]<100){toast("Meter not full");return;}meter[0]=0;cools.spc=2.5;}
    /* lunge */
    if(f1){f1.style.setProperty("--lx","60px");f1.style.setProperty("--lr","8deg");f1.classList.remove("rb-move");void f1.offsetWidth;f1.classList.add("rb-move");}
    SFX.whoosh();
    setTimeout(()=>{
      if(!live)return;
      const blocked=aiBlocking;
      let dmg=kind==="jab"?6:kind==="kick"?12:28;
      dmg*=blocked?0.35:1;
      if(blocking)toast("You block after attacking? Nice try.");
      hp[1]-=dmg;meter[0]=Math.min(100,meter[0]+(kind==="spc"?0:dmg*1.4));
      dmgPop(1,dmg);
      SFX[blocked?"tick":"bonk"]();
      updHud();
      if(hp[1]<=0){endRound(0,"K.O.! "+DIVAS[vs].name+" is DOWN");}
    },180);
    updCools();setTimeout(updCools,50);
  }
  let aiBlocking=false;
  function aiLoop(){
    aiTimer=setInterval(()=>{
      if(!live)return;
      if(Math.random()<0.4){aiBlocking=true;$("#rb-f1",fx)?.classList.add("rb-block");setTimeout(()=>{aiBlocking=false;$("#rb-f1",fx)?.classList.remove("rb-block");},ri(400,900));return;}
      aiBlocking=false;
      const tele=$(".rb-tele",fx);
      const atk=Math.random();
      if(atk<0.5)tele.textContent=DIVAS[vs].name+" winds up a JAB…";
      else if(atk<0.85)tele.textContent=DIVAS[vs].name+" winds up a KICK…";
      else tele.textContent=DIVAS[vs].name+" charges "+RB_STATS[vs].special+"…";
      setTimeout(()=>{
        if(!live)return;
        tele.textContent="";
        const f2=$("#rb-f1",fx);
        if(f2){f2.style.setProperty("--lx","-60px");f2.style.setProperty("--lr","-8deg");f2.classList.remove("rb-move");void f2.offsetWidth;f2.classList.add("rb-move");}
        let dmg=atk<0.5?6:atk<0.85?12:24;
        const guarded=blocking;
        dmg*=guarded?0.3:1;
        setTimeout(()=>{
          if(!live)return;
          hp[0]-=dmg;meter[0]=Math.min(100,meter[0]+6);
          dmgPop(0,dmg);SFX[guarded?"tick":"bonk"]();
          if(guarded)toast("BLOCKED! "+DIVAS[sel].name+" ate almost nothing.");
          updHud();
          if(hp[0]<=0)endRound(1,"K.O.! "+DIVAS[sel].name+" is DOWN");
        },260);
      },ri(650,1000));
    },1500);
  }
  function endRound(winner,why){
    live=false;clearInterval(roundTimer);
    roundsWon[winner]++;
    const loserF=$("#rb-f"+(1-winner),fx);if(loserF)loserF.classList.add("ko");
    SFX[winner===0?"big":"lose"]();
    toast(why);
    setTimeout(()=>{
      if(roundsWon[0]>=2||roundsWon[1]>=2)finish();
      else{round++;startRound();}
    },1500);
  }
  function finish(){
    clearInterval(aiTimer);clearInterval(roundTimer);
    const win=roundsWon[0]>=2;
    const won=win?(roundsWon[1]===0?bet*3:bet*2):0;
    GameCtx.pay(won);
    if(win){
      const tier=roundsWon[1]===0?"jackpot":"mega";
      showFx(tier,{kicker:"DIVA RUMBLE",amount:won,line:roundsWon[1]===0?"Flawless. "+DIVAS[sel].name+" owns the ring.":" wars won 2-1 — brutal.",badges:[DIVAS[sel].name.toUpperCase()+" WINS",roundsWon[0]+"-"+roundsWon[1]]});
      res.append(resultCard("win",DIVAS[sel].name+" takes the ring",won-bet,"2-0 pays x3 · 2-1 pays x2"));
    }else{
      res.append(resultCard("lose",DIVAS[vs].name+" owns the ring",-bet,"Rematch?"));
    }
    const again=el("button","btn-gold","REMATCH");again.style.cssText="margin-top:10px";
    again.onclick=()=>{res.innerHTML="";renderPick();};
    res.append(again);
  }
  renderPick();
  const oldClean=App.cleanup;
  App.cleanup=()=>{clearInterval(aiTimer);clearInterval(roundTimer);if(oldClean)oldClean();};
}});

registerGame("bowling",{name:"Diva Lanes",blurb:"The pins are the ladies themselves.",tag:"NEW · bowling · inner-circle pins",isNew:true,
run(body){
  let bet=GameCtx.bet;
  const wrap=el("div");
  const lane=el("div","bw-lane");
  lane.append(el("div","bw-wood"),el("div","bw-arrows","<i></i><i></i><i></i><i></i>"));
  const frameBar=el("div","bw-framebar");
  const ctl=el("div","bw-ctrl");
  const betR=betRow(v=>{bet=v;});
  const res=el("div");
  wrap.append(lane,frameBar,ctl,betR,res);
  body.append(wrap);
  /* 5 frames, 10 pins */
  const FRAMES=5;
  let frame=1,roll=1,pins=[],standing=10,frameScores=[],ballAnim=null,raf=null;
  const PIN_POS=[];/* triangle */
  const rows=[1,2,3,4];
  rows.forEach((n,r)=>{for(let i=0;i<n;i++)PIN_POS.push({x:50+(i-(n-1)/2)*7.2,y:26-r*7});});
  function newFramePins(){
    /* inner circle ONLY, randomized each frame (req 4) */
    pins=PIN_POS.map(p=>{
      const id=pick(DIVA_IDS);
      const d=el("div","bw-pin stand");
      d.style.left=p.x+"%";d.style.top=(38+p.y*1.5)+"%";
      const w=el("div","bw-ph");const im=new Image();im.src=friendPhoto(id,ri(0,PHOTO_COUNTS[id]-1));im.loading="lazy";
      w.append(im);d.append(w,el("div","pc-name",DIVAS[id].name));
      d._down=false;
      return d;
    });
    $$(".bw-pin",lane).forEach(x=>x.remove());
    pins.forEach(p=>lane.append(p));
  }
  function updFrames(){
    frameBar.innerHTML="";
    for(let f=1;f<=FRAMES;f++){
      const sc=frameScores[f-1];
      const c=el("div","bw-fr"+(f===frame?" cur":""));
      c.innerHTML=`<div>FR ${f}</div><b>${sc===undefined?"·":sc+(sc===10&&roll===1?" STRIKE!":sc===10?" SPARE!":"")}</b>`;
      frameBar.append(c);
    }
    const total=frameScores.filter(x=>x!==undefined).reduce((a,b)=>a+b,0);
    frameBar.append(el("div","bw-fr",`<div>TOTAL</div><b>${total}</b>`));
  }
  let phase="idle";
  function startFrame(){
    if(frame>FRAMES){finish();return;}
    standing=10;newFramePins();updFrames();
    ctl.innerHTML="";ctl.append(aimSlider.el);
    msg.textContent="Frame "+frame+" · Roll "+roll+" — tap to lock AIM";
    phase="aim";
    animSlider(aimSlider,v=>aimDone(v));
  }
  const msg=el("div","cb-msg","");
  const aimSlider=mkSlider("aim");
  const powSlider=mkSlider("pow");
  function mkSlider(kind){
    const w=el("div","bw-aim");
    const nd=el("div","nd");
    if(kind==="pow"){w.className="bw-meter";w.append(el("div","sweet"));}
    w.append(nd);
    return{el:w,nd,val:0.5,dir:1,run:null};
  }
  function animSlider(s,onStop){
    cancelAnimationFrame(s.run);
    const step=()=>{
      s.val+=s.dir*0.017;
      if(s.val>1){s.val=1;s.dir=-1;}if(s.val<0){s.val=0;s.dir=1;}
      s.nd.style.left=(s.val*96)+"%";
      s.run=requestAnimationFrame(step);
    };
    s.run=requestAnimationFrame(step);
    ctl.onpointerdown=()=>{
      cancelAnimationFrame(s.run);
      ctl.onpointerdown=null;
      onStop(s.val);
    };
  }
  function aimDone(v){
    aimVal=v;
    ctl.innerHTML="";ctl.append(powSlider.el);
    msg.textContent="Tap to lock POWER";
    phase="power";
    animSlider(powSlider,vv=>{powVal=vv;spinStep();});
  }
  let aimVal=0.5,powVal=0.5;
  function spinStep(){
    ctl.innerHTML="";
    msg.textContent="Pick the SPIN — hook the pocket";
    phase="spin";
    const row=el("div","bj-actions");
    [["L","hook left"],["S","straight"],["R","hook right"]].forEach(([k,l])=>{
      const b=el("button","btn-ghost",k+"<small style='display:block;font-size:8px'>"+l+"</small>");
      b.onclick=()=>rollBall(k);
      row.append(b);
    });
    ctl.append(row);
  }
  async function rollBall(spin){
    phase="rolling";ctl.innerHTML="";SFX.whoosh();
    const ball=el("div","bw-ball");
    lane.append(ball);
    let x=aimVal*88+6,y=92;
    const power=0.55+powVal*0.75;
    const hook=(spin==="L"?-1:spin==="R"?1:0)*(0.5-Math.abs(aimVal-0.5))*1.6;
    let knocked=0;
    await new Promise(resolve=>{
      let t=0;
      const iv=setInterval(()=>{
        t+=0.02*power*10;
        x+=hook*Math.sin(t/2.2)*0.9+(spin==="S"?0:hook*0.12);
        y-=2.1*power;
        if(y<30){clearInterval(iv);resolve();return;}
        /* pin collisions */
        pins.forEach(p=>{
          if(p._down)return;
          const px=parseFloat(p.style.left),py=parseFloat(p.style.top);
          if(Math.abs(x-px)<4.2&&Math.abs(y-py)<5){
            p._down=true;p.classList.remove("stand");p.classList.add("down");
            knocked++;standing--;SFX.bonk();
            /* chain to neighbours */
            setTimeout(()=>{
              pins.forEach(q=>{
                if(q._down)return;
                const qx=parseFloat(q.style.left),qy=parseFloat(q.style.top);
                const dd=Math.hypot(px-qx,py-qy);
                if(dd<6.5&&Math.random()<0.72){q._down=true;q.classList.remove("stand");q.classList.add("down");knocked++;standing--;SFX.tick();}
              });
            },140);
          }
        });
        ball.style.left=x+"%";ball.style.top=y+"%";
      },33);
    });
    ball.remove();
    const isStrike=roll===1&&knocked===10;
    const isSpare=roll===2&&knocked===standing+knocked&&standing===0&&!isStrike;
    frameScores[frame-1]=(frameScores[frame-1]||0)+knocked;
    if(isStrike||standing===0){
      frameScores[frame-1]=10+(isStrike?0:0);
      await wait(600);
      if(isStrike)showFx("mega",{kicker:"DIVA LANES",amount:0,line:"STRIKE! "+frameScores[frame-1]+" pins — the whole line went down",badges:["STRIKE"]});
      else if(!isSpare&&standing===0)showFx("big",{kicker:"DIVA LANES",amount:0,line:"Spare! Cleaned up the frame",badges:["SPARE"]});
      frame++;roll=1;
      if(frame>FRAMES)finish();else startFrame();
    }else{
      if(roll===1){roll=2;await wait(500);
        msg.textContent="Roll 2 — "+standing+" divas still standing";
        ctl.innerHTML="";phase="aim";
        msg2Lock();}
      else{await wait(500);frame++;roll=1;
        if(frame>FRAMES)finish();else startFrame();}
    }
    updFrames();
  }
  function msg2Lock(){
    msg.textContent="Roll 2 — tap to lock AIM";
    phase="aim";
    animSlider(aimSlider,vv=>{aimDone2(vv);});
  }
  function aimDone2(v){
    aimVal=v;ctl.innerHTML="";ctl.append(powSlider.el);
    msg.textContent="Tap to lock POWER";
    animSlider(powSlider,vv=>{powVal=vv;spinStep();});
  }
  async function finish(){
    cancelAnimationFrame(raf);
    phase="idle";
    const total=frameScores.reduce((a,b)=>a+(b||0),0);
    const strikes=frameScores.filter(x=>x===10&&false).length;
    const won=Math.round(bet*(total>=40?3:total>=30?2:total>=20?1.5:total>=12?1:0));
    GameCtx.pay(won);
    if(won>0){
      const tier=total>=40?"jackpot":total>=30?"mega":"big";
      showFx(tier,{kicker:"DIVA LANES",amount:won,line:total+" pins across 5 frames",badges:[total+" PINS"]});
      res.append(resultCard("win",total+" pins!",won-bet,"40+ pins pays x3 · 30+ x2 · 20+ x1.5 · 12+ x1"));
    }else{SFX.lose();res.append(resultCard("lose","Gutter game",-bet,total+" pins — the ladies barely moved"));}
    const again=el("button","btn-gold","NEW GAME");again.style.cssText="margin-top:10px";
    again.onclick=()=>{res.innerHTML="";frameScores=[];frame=1;roll=1;updFrames();startFrame();};
    res.append(again);
  }
  lane.append(msg);msg.style.cssText="position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:11px;font-weight:800;color:#2b1a06;background:rgba(255,233,184,.75);padding:4px;border-radius:8px;margin:0 8px;z-index:7";
  updFrames();
  const startB=el("button","btn-gold","BOWL · 5 FRAMES");startB.style.cssText="width:100%;margin-top:10px";
  startB.onclick=()=>{
    if(phase!=="idle")return;
    if(!STORE.bet(bet)){toast("Not enough chips");return;}
    GameCtx.wag(bet);
    frameScores=[];frame=1;roll=1;
    ctl.innerHTML="";ctl.append(aimSlider.el);
    startFrame();
  };
  wrap.insertBefore(startB,res);
}});
</script>
<script>
/* ================= FLOOR SLOTS (campaign) ================= */
const FS_STARTER=["ann","sarita","shreya","riddhima","garima","soumya"];
const FS_RANKS=[[400,"Certified Menace"],[250,"Main Character Energy"],[120,"Solid Hang"],[0,"NPC Behavior"]];
const FS_SAVE_KEY="reel-friends-save-v2";
registerGame("floorslots",{name:"Floor Slots",blurb:"5 floors · bosses · shop roguelike",tag:"the original · a slot-machine roguelike",
run(body){
  let S=null;
  const wrap=el("div");
  body.append(wrap);
  function load(){try{const raw=localStorage.getItem(FS_SAVE_KEY);if(raw)S=JSON.parse(raw).state;}catch(e){}}
  function save(){try{localStorage.setItem(FS_SAVE_KEY,JSON.stringify({state:S}));}catch(e){}}
  function newRun(){
    S={phase:"playing",floorIdx:0,coins:10,deck:Object.fromEntries(FS_STARTER.map(d=>[d,1])),levels:{},vibes:[],
       spinsLeft:5,spinsUsedThisFloor:0,floorScore:0,totalScore:0,reels:null,held:[false,false,false],lastResult:null,flashBlind:false,bestSpin:0,runsPlayed:1};
    save();renderFloor();
  }
  function bg(kind){
    const url=BASE+pick(UI_BG[kind]||UI_BG.title);
    return`<img class="bgph" src="${url}" alt="">`;
  }
  function renderTitle(){
    wrap.innerHTML="";
    const t=el("div","glass panel popin");
    t.style.cssText="text-align:center;position:relative;overflow:hidden;min-height:300px";
    t.innerHTML=bg("title")+`
      <div class="in" style="position:relative;z-index:2;padding:20px">
        <p style="font-size:10px;font-weight:900;letter-spacing:.2em;color:rgba(255,233,184,.75)">CAMPAIGN</p>
        <h2 class="headline gold" style="font-size:30px;font-style:italic;font-weight:900;margin:6px 0">Floor Slots</h2>
        <p style="font-size:12px;color:var(--txt-dim);max-width:300px;margin:0 auto">Spin with your friends, chase each floor's chip target, hire between floors, survive the bosses. Coins convert to Den chips when a run ends.</p>
      </div>`;
    const b=el("button","btn-gold","START RUN");b.style.cssText="margin-top:14px";
    b.onclick=()=>{SFX.click();newRun();};
    t.append(b);
    if(S&&S.phase==="playing"&&S.floorIdx>0){
      const c=el("button","btn-ghost","CONTINUE RUN (floor "+(S.floorIdx+1)+", "+S.coins+" coins)");
      c.style.cssText="margin-top:8px";c.onclick=()=>renderFloor();
      t.append(c);
    }
    wrap.append(t);
  }
  function effBase(id){const d=DIVAS[id];return d.base+(((S.levels[id]||1)-1)*2);}
  function bossOf(){const f=FLOORS[Math.min(S.floorIdx,4)];return f.boss?BOSSES[f.boss]:null;}
  function rollReels(){
    const bag=[];
    for(const id of DIVA_IDS){
      const own=S.deck[id]||0;
      const copies=id==="vedhika"?1:2+(own>0?1:0);
      for(let k=0;k<copies;k++)if(own>0||FS_STARTER.includes(id))bag.push(id);
    }
    const out=[];
    for(let i=0;i<3;i++)out.push(pick(bag));
    return out;
  }
  function scoreSpin(reels,firstSpin){
    /* deep copy rules engine */
    const details=[];
    const distinct=[...new Set(reels)];
    const pair=distinct.length===2,triple=distinct.length===1;
    const poolNotOnReels=Object.keys(S.deck).filter(id=>S.deck[id]>0&&!reels.includes(id));
    let zeroed=[];
    const boss=bossOf();
    /* boss debuffs */
    let quirkTxt="";
    if(boss){
      if(boss.name==="The Flaker"&&Math.random()<.5){const i=ri(0,2);if(reels[i]!=="nikki"){zeroed.push(reels[i]);quirkTxt="A reel flaked (The Flaker).";}
        else quirkTxt="Nikki refused to flake.";}
      if(boss.name==="The Ex"&&Math.random()<.25){
        if(S.deck.nikki>0)quirkTxt="The Ex saw Nikki and left voluntarily.";
        else{const strongest=reels.reduce((a,b)=>effBase(b)>effBase(a)?b:a);zeroed.push(strongest);quirkTxt=DIVAS[strongest].name+" stormed off (The Ex).";}
      }
      if(boss.name==="Rent Day"&&S.spinsUsedThisFloor>0){
        if(S.coins>=2){S.coins-=2;quirkTxt="Rent Day collected 2 coins.";}
        else{S.flashBlind=true;quirkTxt="Rent Day: couldn't pay — this spin scores half.";}
      }
    }
    const scores=reels.map(id=>({id,score:0,zero:false}));
    /* base + rules */
    for(const sc of scores){
      if(sc.zero)continue;
      const id=sc.id,d=DIVAS[id];
      let v=effBase(id);
      if(id==="ann")v+=3;
      if(id==="dwiza"){const others=scores.filter(x=>x.id!==id&&!x.zero);v=others.length?Math.max(...others.map(x=>x.score||effBase(x.id))):effBase(id);}
      if(id==="kallie"&&Math.random()<0.4){sc.zero=true;v=0;details.push("Kallie did nothing at all.");}
      if(id==="garima"&&pair)v+=5;
      if(id==="kajal")v+=3*(distinct.filter(x=>x!==id).length);
      if(id==="kanchan"&&distinct.length===3)v+=8;
      if(id==="nikki")v+=0;
      if(id==="nitz"&&triple)v+=2;
      if(id==="pinky")v+=2*distinct.filter(x=>x!==id).length;
      if(id==="priyanka")v+=3*poolNotOnReels.length;
      if(id==="soumya"&&reels[1]===id)v+=5;
      if(id==="sunita"&&boss)v+=8;
      if(id==="shreya")v+=1;
      if(id==="riddhima"){/* handled below: neighbors */}
      sc.score=v;
    }
    /* riddhima neighbors +2 */
    reels.forEach((id,i)=>{
      if(id==="riddhima"&&!scores[i].zero){
        const nb=[i-1,i+1].filter(j=>j>=0&&j<3);
        nb.forEach(j=>{if(!scores[j].zero&&reels[j]!=="riddhima")scores[j].score+=2;});
        details.push("Riddhima's prints radiate: neighbors +2.");
      }
    });
    /* boss zero / flake application (nikki immune) */
    scores.forEach(sc=>{
      if(zeroed.includes(sc.id)&&sc.id!=="nikki"){sc.zero=true;sc.score=0;}
      else if(zeroed.includes(sc.id)&&sc.id==="nikki")details.push("Boss debuffs cannot zero Nikki.");
    });
    /* sarita aura */
    const saritas=reels.filter(x=>x==="sarita").length;
    if(saritas)scores.forEach(sc=>{if(!sc.zero)sc.score+=saritas;});
    /* vibes */
    let mult=1,lines=[];
    if(S.vibes.includes("gremlin")&&Math.random()<1/6){mult*=3;lines.push("Chaos Gremlin: x3!");}
    if(pair&&S.vibes.includes("vibeCheck"))scores.forEach(sc=>{if(!sc.zero)sc.score+=4;});
    if(S.vibes.includes("coupons"))lines.push("Coupon Clipper +1");
    if(S.vibes.includes("loyalty"))scores.forEach(sc=>{if(!sc.zero&&(S.deck[sc.id]||0)>=2)sc.score+=3;});
    if(S.vibes.includes("thirdWheel")&&!scores[1].zero)scores[1].score+=5;
    if(S.vibes.includes("hype")&&scores.some(sc=>!sc.zero)){
      const best=scores.filter(sc=>!sc.zero).sort((a,b)=>b.score-a.score)[0];
      if(best)best.score+=6;
    }
    if(S.vibes.includes("groupChat"))scores.forEach(sc=>{if(!sc.zero)sc.score+=2;});
    if(S.vibes.includes("coupons"))scores.forEach(sc=>{if(!sc.zero)sc.score+=1;});
    if(firstSpin&&S.deck.shalini>0)mult*=2;
    let total=0;
    scores.forEach(sc=>{total+=sc.zero?0:sc.score;});
    total=Math.round(total*mult);
    if(S.flashBlind)total=Math.round(total/2);
    if(S.vibes.includes("coupons"))total+=1;
    if(S.deck.vedhika>0&&reels.includes("vedhika")){S.flashBlind=true;}
    return{total,scores,quirkTxt,lines,details,mult};
  }
  function renderFloor(){
    wrap.innerHTML="";
    const f=FLOORS[Math.min(S.floorIdx,4)];
    const boss=bossOf();
    const c=el("div","fs-floor popin");
    c.innerHTML=bg(f.boss?"gameOver":(S.floorIdx>=4?"victory":"title"))+`<div class="in">
      <p class="sub-h">Floor ${S.floorIdx+1}/5 · ${f.name}</p>
      <div style="display:flex;gap:14px;margin-top:6px;flex-wrap:wrap">
        <span class="bank-pill" style="font-size:12px">🪙 ${S.coins} coins</span>
        <span class="bank-pill" style="font-size:12px">🎯 ${S.floorScore}/${f.target}</span>
        <span class="bank-pill" style="font-size:12px">🎡 ${S.spinsLeft} spins</span>
        <span class="bank-pill" style="font-size:12px">Σ ${S.totalScore} total</span>
      </div>`;
    if(boss){
      const b=el("div","fs-boss");
      const p=ph(BASE+boss.photo,{badge:"BOSS",badgeCls:"scat"});
      p.className="bp";
      p.innerHTML=`<img src="${BASE+boss.photo}" alt="">`;
      b.append(p,el("div","",`<div style="font-size:12px;font-weight:900;color:#ff8a8a">${boss.name}</div><div style="font-size:10px;color:var(--txt-dim)">${boss.quirk}</div>`));
      c.append(b);
    }
    const reelsRow=el("div","fs-reels");
    const reelEls=Array.from({length:3},()=>el("div","fs-reel"));
    reelEls.forEach(r=>reelsRow.append(r));
    c.append(reelsRow);
    const info=el("div","cb-msg","");
    const holdRow=el("div","bj-actions");
    const spinBtn=el("button","btn-gold","SPIN");spinBtn.style.cssText="width:100%;margin-top:8px";
    c.append(info,holdRow,spinBtn);
    const vibesRow=el("div","", ``);vibesRow.style.marginTop="8px";
    if(S.vibes.length)vibesRow.append(...S.vibes.map(v=>el("span","fs-vibe",VIBES[v].name)));
    c.append(vibesRow);
    const deckRow=el("div","glass panel");deckRow.style.marginTop="10px";
    deckRow.append(el("p","sub-h","Your pool"));
    Object.keys(S.deck).filter(id=>S.deck[id]>0).forEach(id=>{
      const d=DIVAS[id];
      const row=el("div","rowline",`<span>${d.name} <span style="color:var(--txt-faint)">Lv${S.levels[id]||1} ×${S.deck[id]}</span></span><b style="font-size:10px;color:var(--txt-dim);text-align:right;max-width:200px">${d.rule}</b>`);
      deckRow.append(row);
    });
    c.append(deckRow);
    wrap.append(c);
    function drawReels(){
      S.reels&&S.reels.forEach((id,i)=>{
        const r=reelEls[i];
        r.innerHTML="";r.classList.toggle("hold",S.held[i]);
        const im=new Image();im.src=friendPhoto(id,ri(0,PHOTO_COUNTS[id]-1));im.loading="eager";
        r.append(im);
      });
    }
    if(!S.reels)S.reels=rollReels();
    drawReels();
    holdRow.innerHTML="";
    S.held.forEach((h,i)=>{
      const b=el("button","btn-ghost","HOLD "+(i+1)+(h?" ✓":""));
      b.style.opacity=h?1:.7;
      b.onclick=()=>{S.held[i]=!S.held[i];SFX.click();drawReels();
        b.textContent="HOLD "+(i+1)+(S.held[i]?" ✓":"");b.style.opacity=S.held[i]?1:.7;};
      holdRow.append(b);
    });
    spinBtn.onclick=async()=>{
      spinBtn.disabled=true;holdRow.innerHTML="";
      SFX.whoosh();
      reelEls.forEach(r=>r.classList.add("spin"));
      const tickT=setInterval(()=>SFX.tick(),90);
      const firstSpin=S.spinsUsedThisFloor===0;
      const result=scoreSpin(S.reels,firstSpin);
      /* respin non-held reels */
      S.reels=S.reels.map((id,i)=>S.held[i]?id:pick(S.reels));
      await wait(700);
      clearInterval(tickT);
      reelEls.forEach(r=>r.classList.remove("spin"));
      drawReels();
      S.spinsUsedThisFloor++;S.spinsLeft--;
      if(S.spinsUsedThisFloor>0&&!S.vibes.includes("dietCoke")&&bossOf()?.name!=="Noise Complaint"){
        const cost=S.held.filter(Boolean).length*1;
        if(cost>0&&S.coins>=cost){S.coins-=cost;SFX.chip();}
      }
      if(bossOf()?.name==="Noise Complaint"){
        const n=S.held.filter(Boolean).length;
        if(n>0&&S.coins>=n*2){S.coins-=n*2;}
      }
      S.floorScore+=result.total;S.totalScore+=result.total;
      S.bestSpin=Math.max(S.bestSpin,result.total);
      S.held=[false,false,false];
      S.reels=null;S.reels=rollReels();
      drawReels();
      /* result */
      const resEl=el("div","res-card popin "+(result.total>=20?"win":"info"));
      const who=result.scores.map(sc=>DIVAS[sc.id].name+(sc.zero?" (zeroed)":" +"+sc.score)).join(" · ");
      resEl.innerHTML=`<div class="rt">${result.total>=20?"BIG SPIN":"SPIN RESULT"}</div><div class="ra">+${result.total}</div><div class="hint">${who}${result.quirkTxt?" · "+result.quirkTxt:""}${result.lines.length?" · "+result.lines.join(" · "):""}</div>`;
      c.insertBefore(resEl,deckRow);
      if(result.total>=20){showFx(result.total>=45?"mega":"win",{kicker:"FLOOR SLOTS",amount:0,line:"Spin scored "+result.total,badges:[]});}
      else SFX.chip();
      S.flashBlind=false;
      save();
      await wait(900);
      if(S.floorScore>=f.target){
        SFX.big();
        toast("Floor cleared! "+f.name);
        if(S.floorIdx>=4){endRun(true);}
        else{S.floorIdx++;S.floorScore=0;S.spinsLeft=5;S.spinsUsedThisFloor=0;S.reels=null;openShop();}
      }else if(S.spinsLeft<=0){
        endRun(false);
      }else{spinBtn.disabled=false;}
    };
  }
  function openShop(){
    wrap.innerHTML="";
    const c=el("div","glass panel popin");
    c.append(el("p","sub-h","🛍️ The Shop — between floors"));
    c.append(el("p","hint","Coins left: "+S.coins+" · recruit friends, level them up (+2 base each), or buy Vibes."));
    const stock=el("div","fs-shop");
    /* build stock: unowned friends + level ups + vibes */
    const items=[];
    DIVA_IDS.forEach(id=>{if(!S.deck[id])items.push({kind:"recruit",id,price:DIVAS[id].price});});
    Object.keys(S.deck).forEach(id=>{if(S.deck[id]>0)items.push({kind:"level",id,price:(DIVAS[id].price)*(S.levels[id]||1)});});
    Object.values(VIBES).forEach(v=>{if(!S.vibes.includes(v.id))items.push({kind:"vibe",id:v.id,price:v.price});});
    shuffle(items).slice(0,6).forEach(it=>{
      const b=el("button","fs-item");
      if(it.kind==="vibe"){
        const v=VIBES[it.id];
        b.innerHTML=`<div style="height:74px;display:grid;place-items:center;font-size:26px;background:#221233;border-radius:9px">✨</div><div class="nm">${v.name}</div><div class="rl">${v.rule}</div><div class="pr">🪙 ${it.price}</div>`;
      }else{
        const d=DIVAS[it.id];
        const p=ph(friendPhoto(it.id,0));p.style.cssText="height:74px;border-radius:9px";
        b.append(p,el("div","nm",d.name+(it.kind==="level"?" · Lv"+((S.levels[it.id]||1)+1):"")),el("div","rl",it.kind==="recruit"?d.rule:d.rule),el("div","pr","🪙 "+it.price));
      }
      b.onclick=()=>{
        if(S.coins<it.price){toast("Not enough coins");return;}
        S.coins-=it.price;
        if(it.kind==="recruit"){S.deck[it.id]=1;S.levels[it.id]=1;toast(DIVAS[it.id].name+" recruited!");}
        else if(it.kind==="level"){S.levels[it.id]=(S.levels[it.id]||1)+1;S.deck[it.id]=Math.min(3,S.deck[it.id]+1);toast(DIVAS[it.id].name+" → Lv"+S.levels[it.id]);}
        else{S.vibes.push(it.id);toast(VIBES[it.id].name+" vibes acquired");}
        SFX.chip();save();openShop();
      };
      stock.append(b);
    });
    c.append(stock);
    const cont=el("button","btn-gold","NEXT FLOOR →");cont.style.cssText="width:100%;margin-top:12px";
    cont.onclick=()=>{save();renderFloor();};
    c.append(cont);
    wrap.append(c);
  }
  function endRun(won){
    S.phase=won?"won":"over";
    const chips=S.coins;
    wrap.innerHTML="";
    const c=el("div","glass panel popin");
    c.style.cssText="text-align:center;position:relative;overflow:hidden;min-height:280px";
    c.innerHTML=bg(won?"victory":"gameOver")+`<div class="in" style="position:relative;z-index:2;padding:18px">
      <p style="font-size:10px;font-weight:900;letter-spacing:.2em;color:rgba(255,233,184,.75)">${won?"RUN COMPLETE":"RUN OVER"}</p>
      <h2 class="headline gold" style="font-size:26px;font-style:italic;font-weight:900;margin:6px 0">${won?"THE DEN SALUTES YOU":FLOORS[S.floorIdx].name+" won this time"}</h2>
      <p style="font-size:12px;color:var(--txt-dim)">Total score ${S.totalScore} · best spin ${S.bestSpin}</p></div>`;
    const rank=FS_RANKS.find(([t])=>S.totalScore>=t)[1];
    c.append(el("p","tagline","RANK: "+rank));
    const dep=el("button","btn-gold","COLLECT "+chips+" COINS → DEN CHIPS");dep.style.cssText="margin-top:12px";
    dep.onclick=()=>{
      if(chips>0){STORE.deposit(chips);GameCtx.won+=chips;SFX.jackpot();
        showFx(won?"jackpot":"big",{kicker:"FLOOR SLOTS",amount:chips,line:chips+" campaign coins converted to Den chips",badges:["RANK: "+rank]});}
      else SFX.chip();
      S.phase="title";S.coins=0;save();
      STORE.record("floorslots",0,chips);
      renderLobby();
      showScreen("lobby");
    };
    c.append(dep);
    wrap.append(c);
    S.coins=0;save();
  }
  load();
  if(S&&S.phase==="playing"&&(S.floorIdx>0||S.coins!==10))renderFloor();
  else if(S&&S.phase==="playing"&&S.floorIdx===0&&S.floorScore>0)renderFloor();
  else renderTitle();
}});

/* ================= boot ================= */
STORE.load();
SFX.muted=!!STORE.muted;
sessionInit();
document.addEventListener("pointerdown",()=>SFX.init(),{once:true});
renderLobby();
showScreen("lobby");
/* openGame records the current game id (for resize handlers) */
const _openGame=openGame;
openGame=function(id){App.current=id;_openGame(id);};
preloadAll();
window.DD={STORE,SESSION,GAMES};
</script>
</body>
</html>
